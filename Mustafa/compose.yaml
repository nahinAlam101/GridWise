services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridwise}
      POSTGRES_USER: ${POSTGRES_USER:-gridwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - gridwise-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  gridwise:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gridwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gridwise}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gridwise-db-data:
